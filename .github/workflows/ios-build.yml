name: iOS Build & IPA

# 免 Mac 云端构建：push 自动编译验证 + 产出未签名 IPA 构件（供 Windows Sideloadly 侧载）
on:
  push:
    paths: ['FunAim/**', 'project.yml', 'Info.plist', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  # 任务 1：模拟器编译验证（无需签名）
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 XcodeGen 2.43.0：保证生成 Xcode 15 可读的 objectVersion 56 工程格式
      - name: Install XcodeGen (pinned 2.43.0)
        run: |
          curl -LsS https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-tmp
          echo "$PWD/xcodegen-tmp/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen

      - name: Verify project
        run: |
          xcodebuild -version
          head -3 FunAim.xcodeproj/project.pbxproj

      - name: Build (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project FunAim.xcodeproj \
            -target FunAim \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "(error:|warning:|BUILD)"

      - name: Upload simulator .app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunAim-simulator-app
          path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/FunAim.app
          if-no-files-found: warn
          retention-days: 7

  # 任务 2：导出未签名 IPA（下载后用 Sideloadly/AltStore 在 Windows 上侧载签名安装）
  ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen (pinned 2.43.0)
        run: |
          curl -LsS https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-tmp
          echo "$PWD/xcodegen-tmp/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project FunAim.xcodeproj \
            -scheme FunAim \
            -destination 'generic/platform=iOS' \
            -archivePath build/FunAim.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          cd build/FunAim.xcarchive/Products/Applications
          mkdir Payload
          cp -R FunAim.app Payload/
          zip -qry FunAim-unsigned.ipa Payload
          ls -lh FunAim-unsigned.ipa

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunAim-unsigned-ipa
          path: build/FunAim.xcarchive/Products/Applications/FunAim-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
