name: iOS Build & IPA

# 免 Mac 云端构建：push 自动编译验证 + 产出未签名 IPA 构件（供 Windows Sideloadly 侧载）
on:
  push:
    paths: ['FunAim/**', 'Tests/**', 'project.yml', 'Info.plist', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  # 任务 1：模拟器编译验证（无需签名）
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 XcodeGen 2.43.0：保证生成 Xcode 15 可读的 objectVersion 56 工程格式
      - name: Install XcodeGen (pinned 2.43.0)
        run: |
          curl -LsS https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-tmp
          echo "$PWD/xcodegen-tmp/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen

      - name: Verify project
        run: |
          xcodebuild -version
          head -3 FunAim.xcodeproj/project.pbxproj

      - name: Build (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project FunAim.xcodeproj \
            -target FunAim \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "(error:|warning:|BUILD)"

      - name: Unit Tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project FunAim.xcodeproj \
            -scheme FunAim \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | tail -60

      - name: Upload simulator .app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunAim-simulator-app
          path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/FunAim.app
          if-no-files-found: warn
          retention-days: 7

  # 任务 2：导出未签名 IPA（下载后用 Sideloadly/AltStore 在 Windows 上侧载签名安装）
  ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen (pinned 2.43.0)
        run: |
          curl -LsS https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip -o xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-tmp
          echo "$PWD/xcodegen-tmp/xcodegen/bin" >> "$GITHUB_PATH"

      # 自动导出 YOLO11n CoreML 并打包进 IPA（导出失败 = 构建失败，保证单一可靠检测路径）
      - name: Cache pip (YOLO export)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-yolo-${{ runner.os }}

      # Python 3.14 上 torch.jit/coremltools 全崩，必须钉 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export YOLO11n CoreML
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --quiet --upgrade pip
          ./venv/bin/pip install --quiet ultralytics coremltools "numpy<2"
          # 不带 NMS 管线：导出原始 [1,84,8400] 张量，由 App 端自行解码（person 类别硬过滤）
          ./venv/bin/python -c "from ultralytics import YOLO; YOLO('yolo11n.pt').export(format='coreml', imgsz=640, nms=False)"
          # 姿态模型：17 关键点（站立/蹲姿/半身 + 人脸露出判定）
          ./venv/bin/python -c "from ultralytics import YOLO; YOLO('yolo11n-pose.pt').export(format='coreml', imgsz=640)"
          if [ -f yolo11n.mlmodel ]; then
            mkdir -p FunAim/Resources
            mv yolo11n.mlmodel FunAim/Resources/yolo11n.mlmodel
            echo "YOLO det model bundled: $(du -h FunAim/Resources/yolo11n.mlmodel)"
          elif [ -d yolo11n.mlpackage ]; then
            mkdir -p FunAim/Resources
            mv yolo11n.mlpackage FunAim/Resources/yolo11n.mlpackage
            echo "YOLO det model bundled (mlpackage)"
          fi
          if [ -f yolo11n-pose.mlmodel ]; then
            mv yolo11n-pose.mlmodel FunAim/Resources/yolo11n-pose.mlmodel
            echo "YOLO pose model bundled: $(du -h FunAim/Resources/yolo11n-pose.mlmodel)"
          elif [ -d yolo11n-pose.mlpackage ]; then
            mv yolo11n-pose.mlpackage FunAim/Resources/yolo11n-pose.mlpackage
            echo "YOLO pose model bundled (mlpackage)"
          else
            echo "::error::pose model export failed"
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project FunAim.xcodeproj \
            -scheme FunAim \
            -destination 'generic/platform=iOS' \
            -archivePath build/FunAim.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          cd build/FunAim.xcarchive/Products/Applications
          mkdir Payload
          cp -R FunAim.app Payload/
          zip -qry FunAim-unsigned.ipa Payload
          ls -lh FunAim-unsigned.ipa

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunAim-unsigned-ipa
          path: build/FunAim.xcarchive/Products/Applications/FunAim-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
